<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <title>RICOCHET OVERDRIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@700;900&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="phoneShell">
    <canvas id="gameCanvas" width="450" height="800"></canvas>

    <div class="xp-track">
      <div id="hudXpBar" class="xp-fill"></div>
    </div>

    <div id="pinchOverlay" class="pinch-vignette hidden"></div>

    <div class="top-hud">
      <div class="hud-col">
        <div class="skew-plate hp-plate">
          <div class="unskew">
            <div class="hp-row">
              <span class="hp-label font-arcade">GATE HP</span>
              <span id="hudHpText" class="hp-num font-arcade">100</span>
            </div>
            <div class="hp-track">
              <div id="hudHpBar" class="hp-fill"></div>
              <div class="hp-segments"></div>
            </div>
          </div>
        </div>
        <div id="buildStrip" class="build-strip"></div>
      </div>

      <div class="skew-plate timer-plate">
        <div class="unskew">
          <div id="hudTime" class="timer-val font-arcade">00:00</div>
          <div id="hudMeta" class="timer-meta font-arcade">LV.1 · 0 KO</div>
        </div>
      </div>

      <div class="hud-col-right">
        <div class="hud-btns">
          <button id="btnMute" type="button" class="icon-btn icon-btn-cyan" aria-label="ミュート切替">🔊</button>
          <button id="btnPause" type="button" class="icon-btn icon-btn-slate" aria-label="一時停止">❚❚</button>
        </div>
        <div id="comboBox" class="skew-plate combo-plate">
          <div class="unskew">
            <div class="combo-row">
              <span id="hudComboHits" class="combo-hits font-arcade">0</span>
              <span class="combo-unit font-arcade">HITS</span>
            </div>
            <div id="hudCombo" class="combo-mult font-arcade">x1.0</div>
          </div>
        </div>
      </div>
    </div>

    <div id="touchHud" class="touch-hud hidden">
      <div id="leftTouchHint" class="tap-hint tap-hint-l font-arcade">◀ L TAP</div>
      <button id="btnNudge" type="button" class="nudge-pill font-arcade">
        <span>⚡ 揺らす</span>
        <span id="hudTiltText" class="tilt-chip">0%</span>
      </button>
      <div id="rightTouchHint" class="tap-hint tap-hint-r font-arcade">R TAP ▶</div>
    </div>

    <div id="overlayStart" class="overlay-start">
      <div class="start-head">
        <div class="skew-plate tag-pill">
          <span class="unskew font-arcade">NEON PINBALL SURVIVOR</span>
        </div>
        <h1 class="logo font-arcade">RICOCHET<br><span class="logo-grad">OVERDRIVE</span></h1>
      </div>

      <div class="start-foot">
        <div class="guide-grid">
          <div class="skew-plate guide-box guide-pink">
            <div class="unskew">
              左右タップで強打
              <span class="guide-sub">ジャスト強打で2.5倍貫通</span>
            </div>
          </div>
          <div class="skew-plate guide-box guide-amber">
            <div class="unskew">
              上スワイプ / 揺らす
              <span class="guide-sub">衝撃波で押し返す (TILT注意)</span>
            </div>
          </div>
        </div>
        <button id="btnStart" type="button" class="btn-primary font-arcade">
          <span>TAP TO START</span>
        </button>
      </div>
    </div>

    <div id="overlayLevelUp" class="overlay-modal levelup-wrap hidden">
      <div class="lu-head">
        <div>
          <div class="skew-plate lu-tag">
            <div class="unskew font-arcade">SYSTEM UPGRADE</div>
          </div>
          <h2 class="lu-title font-arcade">LEVEL UP!</h2>
        </div>
        <div class="skew-plate lu-badge font-arcade">
          <div id="levelUpBadge" class="unskew">LV.2</div>
        </div>
      </div>
      <div id="upgradeList" class="upg-list"></div>
    </div>

    <div id="overlayPause" class="overlay-modal hidden">
      <div class="center-box">
        <h2 class="pause-title font-arcade">PAUSED</h2>
        <div class="stack-btns">
          <button id="btnResume" type="button" class="skew-plate btn-resume font-arcade">
            <span class="unskew" style="display: inline-block;">RESUME</span>
          </button>
          <button id="btnRestartFromPause" type="button" class="skew-plate btn-restart font-arcade">
            <span class="unskew" style="display: inline-block;">RESTART</span>
          </button>
        </div>
      </div>
    </div>

    <div id="overlayEnd" class="overlay-modal hidden">
      <div class="center-box">
        <div id="endTag" class="skew-plate tag-pill">
          <span class="unskew font-arcade">GATE BREACHED</span>
        </div>
        <h2 id="endTitle" class="end-title font-arcade">GAME OVER</h2>
        <div class="stats-grid">
          <div class="skew-plate stat-card" style="border-color: #22d3ee;">
            <div class="unskew">
              <div class="stat-k" style="color: #67e8f9;">TIME</div>
              <div id="statTime" class="stat-v font-arcade">00:00</div>
            </div>
          </div>
          <div class="skew-plate stat-card" style="border-color: #ec4899;">
            <div class="unskew">
              <div class="stat-k" style="color: #f9a8d4;">KILLS</div>
              <div id="statKills" class="stat-v font-arcade">0</div>
            </div>
          </div>
          <div class="skew-plate stat-card" style="border-color: #c084fc;">
            <div class="unskew">
              <div class="stat-k" style="color: #e9d5ff;">LEVEL</div>
              <div id="statLevel" class="stat-v font-arcade">1</div>
            </div>
          </div>
          <div class="skew-plate stat-card" style="border-color: #fbbf24;">
            <div class="unskew">
              <div class="stat-k" style="color: #fde68a;">MAX COMBO</div>
              <div id="statMaxCombo" class="stat-v font-arcade">0</div>
            </div>
          </div>
        </div>
        <button id="btnPlayAgain" type="button" class="btn-primary font-arcade">
          <span>PLAY AGAIN</span>
        </button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
